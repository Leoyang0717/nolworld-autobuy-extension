<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOL World 搶票助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: #f0f2f5;
      color: #333;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #d0d7de;
    }

    .header h1 { font-size: 22px; color: #2c3e50; }
    .header .subtitle { font-size: 12px; color: #666; margin-top: 4px; }
    .header .version  { font-size: 11px; color: #bbb; margin-top: 2px; }

    .section {
      background: white;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .section-title {
      font-weight: bold;
      color: #444;
      margin-bottom: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 15px;
      background: #4caf50;
      border-radius: 2px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 12px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #4caf50;
    }

    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    /* 區域 Tag 輸入 */
    .zone-input-wrapper {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 8px;
      min-height: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      cursor: text;
      transition: border-color 0.2s;
    }

    .zone-input-wrapper:focus-within { border-color: #4caf50; }

    .zone-tag {
      display: inline-flex;
      align-items: center;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
      gap: 4px;
    }

    .zone-tag-remove {
      cursor: pointer;
      color: #888;
      font-size: 14px;
      line-height: 1;
    }

    .zone-tag-remove:hover { color: #f44336; }

    #zoneInput {
      border: none;
      outline: none;
      font-size: 13px;
      min-width: 60px;
      flex: 1;
    }

    /* 間隔設定 */
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 按鈕 */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-start {
      background: #4caf50;
      color: white;
    }
    .btn-start:hover { background: #43a047; }
    .btn-start:disabled { background: #ccc; cursor: not-allowed; }

    .btn-stop {
      background: #757575;
      color: white;
      display: none;
    }
    .btn-stop:hover { background: #616161; }

    .btn-watch {
      background: #1976d2;
      color: white;
    }
    .btn-watch:hover { background: #1565c0; }

    .btn-watch-stop {
      background: #757575;
      color: white;
      display: none;
    }
    .btn-watch-stop:hover { background: #616161; }

    .status-watching { background: #e3f2fd; color: #0d47a1; border-left: 3px solid #1976d2; }

    /* 狀態顯示 */
    .status-box {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .status-idle   { background: #f5f5f5; color: #666; border-left: 3px solid #9e9e9e; }
    .status-running { background: #e8f5e9; color: #2e7d32; border-left: 3px solid #4caf50; }
    .status-found  { background: #fff8e1; color: #f57f17; border-left: 3px solid #ffc107; }
    .status-error  { background: #ffebee; color: #c62828; border-left: 3px solid #f44336; }

    /* 日誌 */
    #logBox {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      border-radius: 6px;
      height: 180px;
      overflow-y: auto;
      line-height: 1.6;
    }

    #logBox .log-line { white-space: pre-wrap; word-break: break-all; }
    #logBox .log-success { color: #4ec9b0; }
    #logBox .log-found   { color: #ffd700; font-weight: bold; }
    #logBox .log-error   { color: #f48771; }

    .clear-log {
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      float: right;
      margin-top: -2px;
    }
    .clear-log:hover { color: #f44336; }

    kbd {
      background: #333;
      color: white;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍇 NOL World 搶票助手</h1>
    <div class="subtitle">自動區域輪詢 · 綠葡萄偵測 · 自動點擊</div>
    <div class="version" id="versionLabel"></div>
  </div>

  <!-- 預約按鈕監聽 -->
  <div class="section">
    <div class="section-title">⏰ 預約搶先點擊</div>
    <div class="hint" style="margin-bottom:10px;">在預約頁面開售前啟動，按鈕解鎖瞬間自動點擊</div>
    <button class="btn btn-watch" id="watchReserveBtn">👁️ 開始監聽預約按鈕</button>
    <button class="btn btn-watch-stop" id="stopWatchReserveBtn">⏸️ 停止監聽</button>
  </div>

  <!-- 座位圖監聽（React SVG 選座頁） -->
  <div class="section">
    <div class="section-title">🎯 座位圖監聽（選座頁）</div>
    <div class="form-group">
      <label>指定 Row（格式：003:009，逗號分隔；留空=全場）</label>
      <input type="text" id="seatRowInput" placeholder="例如：003:009, 003:010（留空=全場）">
      <div class="hint">💡 開售後座位由灰轉紫/綠時立即點擊並按 Submit</div>
    </div>
    <div class="form-group">
      <label>監聽時限（分鐘，0=無限）</label>
      <input type="number" id="seatMapTimeout" min="0" max="60" value="10" style="width:80px;">
      <div class="hint">⏱️ 超過時限自動停止監聽並提醒，需重新進入頁面</div>
    </div>
    <button class="btn btn-watch" id="watchSeatMapBtn">👁️ 開始監聽座位圖</button>
    <button class="btn btn-watch-stop" id="stopWatchSeatMapBtn">⏸️ 停止監聽</button>
  </div>

  <!-- 目標區域 -->
  <div class="section">
    <div class="section-title">🎯 目標區域</div>
    <div class="form-group">
      <label>輸入區域代碼（按 Enter 或逗號新增）</label>
      <div class="zone-input-wrapper" id="zoneWrapper">
        <input type="text" id="zoneInput" placeholder="例如：112、113...">
      </div>
      <div class="hint">💡 依序輪流嘗試；拖曳可調整優先順序</div>
    </div>
  </div>

  <!-- 輪詢設定 -->
  <div class="section">
    <div class="section-title">⏱️ 輪詢設定</div>
    <div class="form-group">
      <label>換區間隔（毫秒）</label>
      <div class="row-2">
        <div>
          <input type="number" id="intervalMin" value="800" min="200" max="10000">
          <div class="hint" style="text-align:center;">最小</div>
        </div>
        <div>
          <input type="number" id="intervalMax" value="1500" min="200" max="10000">
          <div class="hint" style="text-align:center;">最大</div>
        </div>
      </div>
      <div class="hint">💡 每次換區域等待的隨機時間，建議 800~1500ms</div>
    </div>
    <div class="form-group">
      <label>持續時間（分鐘）</label>
      <input type="number" id="duration" value="5" min="1" max="60">
      <div class="hint">💡 建議 5~6 分鐘，預留時間給後續填資料結帳</div>
    </div>
  </div>

  <!-- 狀態 -->
  <div class="section">
    <div class="section-title">📊 狀態</div>
    <div id="statusBox" class="status-box status-idle">💤 尚未啟動</div>
    <div id="statsRow" style="display:none; margin-top:8px; font-size:12px; color:#555;">
      已嘗試 <strong id="attemptCount">0</strong> 次・已過 <strong id="elapsedTime">00:00</strong>
    </div>
  </div>

  <!-- 控制 -->
  <button class="btn btn-start" id="startBtn">🚀 開始搶票</button>
  <button class="btn btn-stop" id="stopBtn">⏸️ 停止搶票</button>

  <!-- 日誌 -->
  <div class="section">
    <div class="section-title">
      📋 日誌
      <span class="clear-log" id="clearLog">清除</span>
    </div>
    <div id="logBox"></div>
  </div>

  <div style="text-align:center; font-size:11px; color:#bbb; margin-top:8px;">
    緊急停止：<kbd>F6</kbd>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
